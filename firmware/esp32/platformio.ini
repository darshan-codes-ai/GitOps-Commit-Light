; PlatformIO Project Configuration File for GitOps Commit Light ESP32
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev
description = GitOps Commit Light - ESP32 AWS IoT Core MQTT Subscriber

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Serial Monitor Options
monitor_speed = 115200
monitor_filters =
    esp32_exception_decoder
    time
    default

; Upload Options
upload_speed = 921600

; Library Dependencies
lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^6.21.4

; Build Flags
; 1. MQTT_MAX_PACKET_SIZE=2048: Increases PubSubClient buffer to accommodate realistic Schema v1 commit payloads
; 2. CORE_DEBUG_LEVEL=0: Clean serial output (set to 3 for verbose ESP-IDF debugging)
build_flags =
    -D MQTT_MAX_PACKET_SIZE=2048
    -D CORE_DEBUG_LEVEL=0
